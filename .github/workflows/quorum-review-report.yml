name: Quorum Review (report)
on:
  workflow_run:
    workflows: ["Quorum Review (analyze)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - name: Install quorum from trusted main branch
        run: cargo install --path . --locked
      - uses: actions/download-artifact@v8
        with:
          name: quorum-findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate head_sha format
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::Invalid head_sha format: $HEAD_SHA"
            exit 1
          fi
      - name: Post review
        run: |
          # #496: the PR number comes from the analyze job, which ran on
          # `pull_request` and knew it. Deriving it here from the head SHA
          # returns nothing for fork PRs, and the previous version passed the
          # resulting empty string straight to `--pr`.
          if [ ! -s pr-number.txt ]; then
            echo "::error::pr-number.txt missing or empty; refusing to post without a PR number"
            exit 1
          fi
          PR_NUMBER=$(tr -d '[:space:]' < pr-number.txt)
          if ! echo "$PR_NUMBER" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Invalid PR number: '$PR_NUMBER'"
            exit 1
          fi
          quorum report findings.json --pr "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
