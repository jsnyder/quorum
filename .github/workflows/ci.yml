name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: stable-${{ matrix.os }}
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: stable-ubuntu-latest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Currently informational: repo-wide `cargo fmt` has not been applied; see
    # issue tracker. Drop this flag once the formatting catch-up PR lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.93 (snapshot)
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: msrv-ubuntu-latest
      - run: cargo check --workspace --locked

  eval:
    name: eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Deps only, not `pip install -e .`: eval/ is a flat module layout beside
      # data dirs (corpus, results, binaries), so setuptools auto-discovery
      # refuses to build it. Nothing here needs the package installed --
      # pyproject sets `pythonpath = ["."]` so pytest imports the modules
      # directly.
      - name: install
        working-directory: eval
        run: pip install pytest httpx
      - name: pytest
        working-directory: eval
        run: python -m pytest tests -q
      # The scorer could not load its own corpus for an unknown length of time
      # (#485) because nothing ever walked the whole thing. The unit tests use
      # synthetic fixtures and would not have caught it, so load the real corpus
      # and assert the partition, which is the check that was missing.
      - name: full corpus loads and partitions
        working-directory: eval
        run: |
          python -c "
          import pathlib, sys
          from scorecard import _partition_corpus
          p = _partition_corpus(pathlib.Path('corpus'))
          actual = (len(p.scoreable), len(p.rejected), len(p.controls))
          expected = (63, 14, 1)
          print(f'{actual[0]} scoreable / {actual[1]} rejected / {actual[2]} control')
          if actual != expected:
              sys.exit(
                  f'corpus partition changed: got {actual}, expected {expected}. '
                  'If this is a deliberate corpus change, update the expected '
                  'tuple in this workflow in the same commit -- the numbers are '
                  'pinned so that a silent drop or a miscategorised entry, which '
                  'shifts every recall denominator and breaks comparison against '
                  'earlier benchmark runs, cannot pass unnoticed.'
              )
          "
