name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: stable-${{ matrix.os }}
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: stable-ubuntu-latest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Currently informational: repo-wide `cargo fmt` has not been applied; see
    # issue tracker. Drop this flag once the formatting catch-up PR lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (snapshot)
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.93 (snapshot)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: msrv-ubuntu-latest
      - run: cargo check --workspace --locked

  eval:
    name: eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: install
        working-directory: eval
        run: pip install -e '.[dev]'
      - name: pytest
        working-directory: eval
        run: python -m pytest tests -q
      # The scorer could not load its own corpus for an unknown length of time
      # (#485) because nothing ever walked the whole thing. The unit tests use
      # synthetic fixtures and would not have caught it, so load the real corpus
      # and assert the partition, which is the check that was missing.
      - name: full corpus loads and partitions
        working-directory: eval
        run: |
          python -c "
          import pathlib, sys
          from scorecard import _partition_corpus
          p = _partition_corpus(pathlib.Path('corpus'))
          total = len(p.scoreable | p.rejected | p.controls)
          print(f'{len(p.scoreable)} scoreable / {len(p.rejected)} rejected / {len(p.controls)} control = {total}')
          if total == 0:
              sys.exit('corpus loaded zero entries')
          if not p.scoreable:
              sys.exit('corpus has no scoreable entries; recall denominator would be zero')
          "
