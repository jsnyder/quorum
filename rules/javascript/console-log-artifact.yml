id: console-log-artifact
language: JavaScript
severity: hint
message: "`console.log()` left in code. Remove debug artifacts before shipping, or use a structured logger."
note: "Feedback: 30 confirmed true positives"
rule:
  pattern: console.log($$$)
  not:
    inside:
      kind: catch_clause
      stopBy: end
metadata:
  # Debug logging in a test file is normal. Same prod-only class as
  # assert-in-prod-code.
  skip_test_files: true
