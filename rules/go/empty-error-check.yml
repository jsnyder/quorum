id: empty-error-check
language: go
severity: warning
message: "Error is checked but silently swallowed. Return or log the error."
rule:
  all:
    - kind: if_statement
    - has:
        kind: binary_expression
        regex: 'err\s*!=\s*nil'
    - has:
        kind: block
        not:
          regex: 'err'
