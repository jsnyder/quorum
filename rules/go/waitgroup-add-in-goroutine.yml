id: waitgroup-add-in-goroutine
language: go
severity: warning
message: "wg.Add() called inside goroutine. Call wg.Add() before launching the goroutine."
rule:
  all:
    - kind: call_expression
    - has:
        kind: selector_expression
        regex: '\.Add$'
  inside:
    kind: go_statement
    stopBy: end
