id: range-loop-variable-capture
language: go
severity: warning
message: "Goroutine launched inside loop body. Verify loop variables are not captured by closure (safe in Go 1.22+, or when passed as function arguments)."
rule:
  pattern: |
    go func($$$PARAMS) {
      $$$BODY
    }($$$ARGS)
  inside:
    kind: for_statement
    stopBy: end
