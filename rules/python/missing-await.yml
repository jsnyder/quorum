id: missing-await
language: Python
severity: warning
message: "Async function called without await. Return value may be an unawaited coroutine."
rule:
  kind: call
  inside:
    kind: expression_statement
    inside:
      kind: function_definition
      regex: "^\\s*async\\s+def\\b"
      stopBy: end
  not:
    inside:
      kind: await
      stopBy: neighbor
metadata:
  precision: speculative
  judge: required
